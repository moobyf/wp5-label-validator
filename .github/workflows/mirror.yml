name: Mirror to GitLab
on: [push, delete, create]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/marbec/moobyf/wp5-label-validator.git
          git push --force --prune gitlab \
            refs/remotes/origin/*:refs/heads/* refs/tags/*:refs/tags/*
